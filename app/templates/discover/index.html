{% extends 'base_app.html' %}

{% block title %}Notella — Discover{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}"/>
<link rel="stylesheet" href="{{ url_for('static', filename='css/discover.css') }}"/>
{% endblock %}

{% block page_content %}
<!-- Header -->
<div class="dash-greeting">EXPLORE CONTENT MADE BY OTHERS</div>
<div class="dash-title">Discover</div>

<!-- Controls -->
<div class="dash-controls">
    <div class="tab-toggle">
        <button class="tab-btn active" onclick="switchTab('notes', this)">Notes</button>
        <div class="tab-divider"></div>
        <button class="tab-btn" onclick="switchTab('decks', this)">Flashcard Decks</button>
    </div>

    <div class="search-row">
        <!--search input-->
        <input class="search-input" type="text" placeholder="Search..." id ="search-input">
        <!--Tag filter-->
        <div style="position:relative;" id="tag-wrapper">
            <button class="tag-filter-btn" id="tag-filter-btn" onclick="openTagModal()" title="Filter by tags">
                <i class="bi bi-funnel"></i>
                <span class="tag-filter-count" id="tag-filter-count" style="display:none;"></span>
            </button>
            <div class="tag-modal" id="tag-modal" style="display:none;">
                <div class="tag-modal-header">
                    <span class="tag-modal-title">Filter by Tags</span>
                    <button class="tag-modal-clear" onclick="clearTags()">Clear all</button>
                </div>
                <div class="tag-modal-pills" id="tag-modal-pills"></div>
            </div>
        </div>
        <div class="tag-modal-backdrop" id="tag-modal-backdrop" style="display:none;" onclick="closeTagModal()"></div>
        <!--sort dropdown-->
        <div class="select" id="sort-wrapper">
            <button class="select-btn" id="sort-btn">
                Most Likes <i class="bi bi-chevron-down" style="font-size: 11px;"></i>
            </button>
            <div class="select-dropdown" id="sort-dropdown">
                <div class="select-option active" data-value="likes">Most Likes</div>
                <div class="select-option" data-value="date">Date Created</div>
                <div class="select-option" data-value="alpha">Alphabetical</div>
            </div>
        </div>
    </div>
</div>
<div class="dash-divider"></div>

<!--Notes panel-->
<div id="panel-notes">
    <div class="notes-grid" id="notes-grid"></div>
</div>

<!--Decks panel-->
<div id="panel-decks" style="display:none;">
    <div class="notes-grid" id="decks-grid"></div>
</div>


<script src="{{ url_for('static', filename='js/discover.js') }}"></script>

<!--
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

-->
{% endblock %}
